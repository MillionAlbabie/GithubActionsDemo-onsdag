name: Java CI with Maven (Optimized)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (root pom.xml)
        run: mvn -f ./pom.xml -B package

      - name: Run tests with Maven (root pom.xml)
        run: mvn -f ./pom.xml test